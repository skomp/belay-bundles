bundle_format: 1
id: pico-ps2-usb-adapter
version: "1.1"
report:
  url: https://github.com/skomp/belay-bundles/issues/new
  prefill: github
title: Build a PS/2 to USB HID Keyboard Adapter on the Raspberry Pi Pico
description: >
  Build an adapter that presents an IBM Model M over PS/2 to any modern computer
  as an ordinary USB HID keyboard, and learn the embedded, electrical, timing and
  protocol layers it stands on.
teaching_method: >
  Every stage ends in something you can observe on an instrument or on the host
  before the next one starts. You see the PS/2 signal before you decode it, you
  write the receiver with interrupts before you offload it to PIO, and you write
  every USB descriptor by hand. The tutor reads evidence off your board's debug
  console and never advances on an assertion.
subjects: [embedded, microcontrollers, rp2040, usb, hid, ps2, electronics, firmware, c]
aliases: [model m, keyboard adapter, ps2 to usb, raspberry pi pico, rp2040, pio, usb hid, tinyusb, mechanical keyboard, buckling spring, pico-sdk]
level: intermediate
style: [project-driven, interactive, long-form]

lessons:
  - lessons/00-first-code-and-a-window-in.md
  - lessons/01-the-ps2-connector-and-what-is-safe.md
  - lessons/02-open-drain-and-pull-ups.md
  - lessons/03-see-the-protocol-before-you-decode-it/LESSON.md
  - lessons/04-your-first-interrupt.md
  - lessons/05-a-state-machine-in-an-isr.md
  - lessons/06-handing-data-to-the-main-loop.md
  - lessons/07-what-a-pio-state-machine-is.md
  - lessons/08-ps2-receive-in-pio.md
  - lessons/09-talking-back-in-pio/LESSON.md
  - lessons/10-scan-codes-to-key-events.md
  - lessons/11-descriptors-you-write-yourself.md
  - lessons/12-the-hid-report-descriptor.md
  - lessons/13-your-first-keystroke.md
  - lessons/14-events-to-state/LESSON.md
  - lessons/15-the-lock-leds.md
  - lessons/16-when-it-goes-wrong.md
  - lessons/17-robustness-and-the-real-world.md
  - lessons/18-off-the-breadboard-and-done/LESSON.md
  - lessons/19-does-it-pass/LESSON.md

workspace_kind: new-repository
tutor_owned: [tutorial/STATE.md, tutorial/DESIGN.md]
learner_owned:
  - src/**
  - include/**
  - pio/**
  - checks/**
  - docs/**
  - captures/**
  - CMakeLists.txt
  - pico_sdk_import.cmake
  - README.md
  - BOM.md
  - device.env
ownership_policy: tutor-must-not-edit-learner-owned

